apiVersion: 1

datasources:
  # L'uid est figé car usermgmt-dashboard.json référence le datasource par uid.
  # Sans lui, Grafana en génère un aléatoire et les panels restent vides.
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
