parent=keycloak.v2
import=common/keycloak

styles=css/styles.css

# Les libellés français viennent du thème de base de Keycloak ; il suffit de les
# déclarer ici et d'activer l'internationalisation sur le realm
# (internationalizationEnabled + defaultLocale, voir keycloak/realm-export.json).
locales=fr,en

meta.viewport=width=device-width,initial-scale=1
